<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kalyan's Lab · Quantum Metropolis ($0 Three.js 3D City)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #04060E;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #FFFFFF;
      user-select: none;
    }

    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Ambient Cinematic Vignette */
    .bg-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(4, 6, 14, 0) 35%, rgba(2, 3, 8, 0.94) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Top HUD Header */
    .hud-header {
      position: absolute;
      top: 24px;
      left: 0;
      width: 100%;
      padding: 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
      pointer-events: auto;
    }
    .brand-logo {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      width: 32px;
      height: 30px;
      padding: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      backdrop-filter: blur(12px);
    }
    .bar { border-radius: 2px; }
    .bar-1 { width: 6px; height: 12px; background: #FF453A; }
    .bar-2 { width: 6px; height: 18px; background: #E5E5EA; }
    .bar-3 { width: 6px; height: 24px; background: #FFD60A; }

    .brand-text {
      display: flex;
      flex-direction: column;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-live {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 800;
      color: #00F5D4;
      background: rgba(0, 245, 212, 0.12);
      border: 1px solid rgba(0, 245, 212, 0.35);
      padding: 2px 7px;
      border-radius: 999px;
      letter-spacing: 0.04em;
    }
    .brand-subtitle {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #8E9BAE;
      margin-top: 2px;
    }

    .header-pills {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }
    .hud-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(14, 20, 32, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      color: #DDE5F0;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .hud-pill:hover {
      background: rgba(0, 245, 212, 0.15);
      border-color: #00F5D4;
      color: #00F5D4;
    }
    .hud-pill.highlight {
      background: #FF3B30;
      border-color: #FF3B30;
      color: #FFFFFF;
      font-weight: 800;
    }

    /* Editorial Text for Shorts Framing */
    .editorial-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 85px 24px 85px 24px;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .editorial-top {
      text-align: center;
      max-width: 680px;
    }
    .editorial-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.22em;
      color: #FFD60A;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .editorial-h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      line-height: 1.15;
      text-shadow: 0 4px 24px rgba(0,0,0,0.9);
      background: linear-gradient(180deg, #FFFFFF 30%, #C7D2FE 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .editorial-sub {
      font-size: 14px;
      font-weight: 600;
      color: #00F5D4;
      margin-top: 6px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.85);
      letter-spacing: 0.02em;
    }

    .editorial-bottom {
      text-align: center;
      max-width: 600px;
    }
    .editorial-caption-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 18px;
      border-radius: 999px;
      background: rgba(10, 15, 26, 0.9);
      border: 1px solid rgba(0, 245, 212, 0.4);
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
    }
    .editorial-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00F5D4;
      box-shadow: 0 0 10px #00F5D4;
    }
    .editorial-caption-text {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #FFFFFF;
    }

    /* Bottom Control Dock */
    .bottom-dock {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 25;
      pointer-events: auto;
      background: rgba(10, 15, 25, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(20px);
      padding: 6px 12px;
      border-radius: 999px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.75);
      flex-wrap: wrap;
      justify-content: center;
    }
    .dock-btn {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #D0D8E6;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 7px 13px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }
    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.3);
    }
    .dock-btn.active {
      background: #00F5D4;
      color: #050811;
      border-color: #00F5D4;
      font-weight: 800;
    }

    @media (max-width: 768px) {
      .hud-header { padding: 0 16px; top: 16px; }
      .brand-subtitle, .hud-pill.hide-mob { display: none; }
      .editorial-h1 { font-size: 24px; }
      .bottom-dock { width: 94%; padding: 5px 6px; gap: 5px; }
      .dock-btn { font-size: 11px; padding: 5px 8px; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="webgl-container"></div>
  <div class="bg-vignette"></div>

  <!-- Header -->
  <header class="hud-header">
    <div class="brand-group">
      <div class="brand-logo">
        <div class="bar bar-1"></div>
        <div class="bar bar-2"></div>
        <div class="bar bar-3"></div>
      </div>
      <div class="brand-text">
        <div class="brand-title">
          Kalyan's Lab
          <span class="badge-live" id="fps-badge">60 FPS</span>
        </div>
        <div class="brand-subtitle">Quantum Metropolis · Procedural Three.js Island</div>
      </div>
    </div>

    <div class="header-pills">
      <a href="https://github.com/jalagamkalyan/3d-motion-graphics-workflow" target="_blank" class="hud-pill hide-mob">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        GitHub Code
      </a>
      <a href="https://youtube.com/@KalyansLab?sub_confirmation=1" target="_blank" class="hud-pill highlight">
        Subscribe
      </a>
    </div>
  </header>

  <!-- Editorial Overlay for Video Capture -->
  <div class="editorial-overlay" id="editorial-hud">
    <div class="editorial-top">
      <div class="editorial-tag">⚡ $0 PROCEDURAL THREE.JS</div>
      <h1 class="editorial-h1">MAKE CUSTOM 3D WORLDS FOR $0</h1>
      <div class="editorial-sub">Quantum Metropolis · Pure Code · 60 FPS in Chrome</div>
    </div>

    <div class="editorial-bottom">
      <div class="editorial-caption-pill">
        <div class="editorial-dot"></div>
        <div class="editorial-caption-text">Diorama Flyover · Real-Time Dynamic Lighting</div>
      </div>
    </div>
  </div>

  <!-- Bottom Dock -->
  <div class="bottom-dock">
    <button class="dock-btn active" id="btn-orbit">🔄 360° Flyover</button>
    <button class="dock-btn" id="btn-turbo">⚡ Turbo Speed</button>
    <button class="dock-btn" id="btn-wireframe">🌐 Wireframe</button>
    <button class="dock-btn" id="btn-text">👁️ Toggle Text</button>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════
    // 1. SCENE & CAMERA INITIALIZATION
    // ═══════════════════════════════════════════════════════════════
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x04060E);
    scene.fog = new THREE.FogExp2(0x04060E, 0.012);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 1000);

    function getFramingParams() {
      const aspect = window.innerWidth / window.innerHeight;
      if (aspect < 0.75) {
        // Vertical 9:16 Shorts Framing
        return { radius: 62.0, height: 42.0, targetY: 4.0 };
      } else if (aspect < 1.2) {
        // Square / Tablet
        return { radius: 54.0, height: 36.0, targetY: 3.5 };
      } else {
        // 16:9 Landscape Desktop
        return { radius: 46.0, height: 30.0, targetY: 3.0 };
      }
    }

    let framing = getFramingParams();
    let orbitAngle = 0.785;
    camera.position.set(Math.sin(orbitAngle) * framing.radius, framing.height, Math.cos(orbitAngle) * framing.radius);
    camera.lookAt(0, framing.targetY, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.45;
    container.appendChild(renderer.domElement);

    // ═══════════════════════════════════════════════════════════════
    // 2. PROCEDURAL HIGH-LUMINESCENCE TEXTURES
    // ═══════════════════════════════════════════════════════════════

    // A. Glowing Window Facade (Bright Warm Gold, Radiant Cyan & Xenon White)
    function createFacadeTexture() {
      const cv = document.createElement('canvas');
      cv.width = 512;
      cv.height = 1024;
      const ctx = cv.getContext('2d');

      // Deep dark obsidian facade
      ctx.fillStyle = '#070A12';
      ctx.fillRect(0, 0, 512, 1024);

      const rows = 32;
      const cols = 10;
      const wW = 512 / cols;
      const wH = 1024 / rows;
      const padX = 7;
      const padY = 7;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = c * wW + padX / 2;
          const y = r * wH + padY / 2;
          const w = wW - padX;
          const h = wH - padY;

          const rand = Math.random();
          if (rand > 0.44) {
            if (rand > 0.88) {
              // Neon Electric Cyan (12%)
              ctx.fillStyle = '#00F5D4';
              ctx.shadowColor = '#00F5D4';
              ctx.shadowBlur = 14;
            } else if (rand > 0.52) {
              // Radiant Warm Amber-Gold (36%)
              ctx.fillStyle = '#FFD166';
              ctx.shadowColor = '#FFB703';
              ctx.shadowBlur = 12;
            } else {
              // Pure Xenon White (8%)
              ctx.fillStyle = '#FFFFFF';
              ctx.shadowColor = '#FFFFFF';
              ctx.shadowBlur = 10;
            }
            ctx.fillRect(x, y, w, h);
            ctx.shadowBlur = 0;
          } else {
            // Dark window reflection
            ctx.fillStyle = '#0C1220';
            ctx.fillRect(x, y, w, h);
          }
        }
      }

      // Vertical architectural structural ribs
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.lineWidth = 2.5;
      for (let c = 0; c <= cols; c++) {
        ctx.beginPath();
        ctx.moveTo(c * wW, 0);
        ctx.lineTo(c * wW, 1024);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = 8;
      return tex;
    }

    // B. Ground Street Surface Texture (Charcoal Asphalt with Clean Grid)
    function createGroundTexture() {
      const cv = document.createElement('canvas');
      cv.width = 1024;
      cv.height = 1024;
      const ctx = cv.getContext('2d');

      // Dark asphalt
      ctx.fillStyle = '#080C14';
      ctx.fillRect(0, 0, 1024, 1024);

      // Micro grid matrix
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 1024; i += 32) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 1024); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(1024, i); ctx.stroke();
      }

      // Glowing Cyan street avenues
      ctx.strokeStyle = 'rgba(0, 245, 212, 0.35)';
      ctx.lineWidth = 3;
      for (let i = 128; i < 1024; i += 256) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 1024); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(1024, i); ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 2);
      return tex;
    }

    const facadeTex = createFacadeTexture();
    const groundTex = createGroundTexture();

    // ═══════════════════════════════════════════════════════════════
    // 3. MATERIALS
    // ═══════════════════════════════════════════════════════════════
    const buildingMat = new THREE.MeshStandardMaterial({
      map: facadeTex,
      emissiveMap: facadeTex,
      emissive: new THREE.Color(0xFFFFFF),
      emissiveIntensity: 0.7,
      roughness: 0.25,
      metalness: 0.85
    });

    const roofMat = new THREE.MeshStandardMaterial({
      color: 0x090D16,
      roughness: 0.85,
      metalness: 0.2
    });

    const groundMat = new THREE.MeshStandardMaterial({
      map: groundTex,
      roughness: 0.85,
      metalness: 0.2
    });

    const pedestalMat = new THREE.MeshStandardMaterial({
      color: 0x030509,
      metalness: 0.95,
      roughness: 0.15
    });

    const cyanNeonMat = new THREE.MeshBasicMaterial({ color: 0x00F5D4 });
    const goldNeonMat = new THREE.MeshBasicMaterial({ color: 0xFFD60A });
    const beaconRedMat = new THREE.MeshBasicMaterial({ color: 0xFF3B30 });
    const lampGlowMat = new THREE.MeshBasicMaterial({ color: 0xFFE082 });

    // ═══════════════════════════════════════════════════════════════
    // 4. FLOATING ISLAND PEDESTAL
    // ═══════════════════════════════════════════════════════════════
    const cityIsland = new THREE.Group();
    scene.add(cityIsland);

    const islandSize = 34.0;

    // Ground Surface
    const groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(islandSize, islandSize), groundMat);
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.position.y = 0.01;
    cityIsland.add(groundMesh);

    // Beveled Obsidian Pedestal Base
    const pedestalMesh = new THREE.Mesh(new THREE.BoxGeometry(islandSize + 0.4, 2.0, islandSize + 0.4), pedestalMat);
    pedestalMesh.position.y = -1.0;
    cityIsland.add(pedestalMesh);

    // 4 Edge Perimeter Neon Strips (True hollow rim border)
    const rimThickness = 0.12;
    const rimHeight = 0.12;
    const halfS = islandSize / 2;

    const rim1 = new THREE.Mesh(new THREE.BoxGeometry(islandSize, rimHeight, rimThickness), cyanNeonMat);
    rim1.position.set(0, 0.06, halfS);
    cityIsland.add(rim1);

    const rim2 = new THREE.Mesh(new THREE.BoxGeometry(islandSize, rimHeight, rimThickness), cyanNeonMat);
    rim2.position.set(0, 0.06, -halfS);
    cityIsland.add(rim2);

    const rim3 = new THREE.Mesh(new THREE.BoxGeometry(rimThickness, rimHeight, islandSize), cyanNeonMat);
    rim3.position.set(halfS, 0.06, 0);
    cityIsland.add(rim3);

    const rim4 = new THREE.Mesh(new THREE.BoxGeometry(rimThickness, rimHeight, islandSize), cyanNeonMat);
    rim4.position.set(-halfS, 0.06, 0);
    cityIsland.add(rim4);

    // ═══════════════════════════════════════════════════════════════
    // 5. SKYLINE & URBAN DIORAMA ARCHITECTURE
    // ═══════════════════════════════════════════════════════════════
    const bMeshMaterials = [
      buildingMat, buildingMat,
      roofMat, roofMat,
      buildingMat, buildingMat
    ];

    const beaconLights = [];
    const numBlocks = 7;
    const blockPitch = islandSize / numBlocks;
    const streetWidth = 1.5;
    const maxPlot = blockPitch - streetWidth;

    // Street Corner Lamps
    const lampGeo = new THREE.CylinderGeometry(0.035, 0.035, 1.0, 6);
    const lampPoleMat = new THREE.MeshStandardMaterial({ color: 0x64748B, metalness: 0.8 });
    const bulbGeo = new THREE.SphereGeometry(0.12, 8, 8);

    for (let x = 0; x <= numBlocks; x++) {
      for (let z = 0; z <= numBlocks; z++) {
        const lx = (x * blockPitch) - (islandSize / 2);
        const lz = (z * blockPitch) - (islandSize / 2);

        const pole = new THREE.Mesh(lampGeo, lampPoleMat);
        pole.position.set(lx, 0.5, lz);
        cityIsland.add(pole);

        const bulb = new THREE.Mesh(bulbGeo, lampGlowMat);
        bulb.position.set(lx, 1.05, lz);
        cityIsland.add(bulb);
      }
    }

    // Skyscraper Generation
    for (let bx = 0; bx < numBlocks; bx++) {
      for (let bz = 0; bz < numBlocks; bz++) {
        const posX = (bx * blockPitch) - (islandSize / 2) + (blockPitch / 2);
        const posZ = (bz * blockPitch) - (islandSize / 2) + (blockPitch / 2);

        // Center reserved for Quantum Spire Landmark
        if (bx === 3 && bz === 3) continue;

        // Plazas
        if ((bx === 1 && bz === 5) || (bx === 5 && bz === 1)) {
          const coreM = new THREE.Mesh(new THREE.OctahedronGeometry(0.7, 0), cyanNeonMat);
          coreM.position.set(posX, 1.2, posZ);
          cityIsland.add(coreM);
          continue;
        }

        const dist = Math.sqrt(posX * posX + posZ * posZ);
        let h = Math.max(2.2, 13.5 - (dist * 0.6) + (Math.sin(bx * 2.5) * 2.6) + (Math.cos(bz * 2.8) * 2.6));

        // Corner Towers
        if ((bx === 1 && bz === 1) || (bx === 5 && bz === 5)) {
          h = Math.max(h, 11.5);
        }

        const w = maxPlot * (0.8 + Math.random() * 0.18);
        const d = maxPlot * (0.8 + Math.random() * 0.18);

        const bMesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bMeshMaterials);
        bMesh.position.set(posX, h / 2, posZ);
        cityIsland.add(bMesh);

        // Rooftop Architecture
        if (h > 6.0) {
          const setH = 1.4 + Math.random() * 1.6;
          const setW = w * 0.65;
          const setD = d * 0.65;
          const setMesh = new THREE.Mesh(new THREE.BoxGeometry(setW, setH, setD), bMeshMaterials);
          setMesh.position.set(posX, h + setH / 2, posZ);
          cityIsland.add(setMesh);

          if (h > 8.5) {
            const antH = 2.2 + Math.random() * 2.0;
            const antMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.07, antH, 6), lampPoleMat);
            antMesh.position.set(posX, h + setH + antH / 2, posZ);
            cityIsland.add(antMesh);

            const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 8), beaconRedMat);
            beacon.position.set(posX, h + setH + antH, posZ);
            cityIsland.add(beacon);
            beaconLights.push(beacon);
          }
        }
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // 6. HERO LANDMARK: THE QUANTUM SPIRE (H_TOTAL = 20.5)
    // ═══════════════════════════════════════════════════════════════
    const spireGroup = new THREE.Group();
    spireGroup.position.set(0, 0, 0);
    cityIsland.add(spireGroup);

    // Tier 1 Base Skyscraper (H = 9.5)
    const t1H = 9.5;
    const t1W = maxPlot * 0.98;
    const t1Mesh = new THREE.Mesh(new THREE.BoxGeometry(t1W, t1H, t1W), bMeshMaterials);
    t1Mesh.position.y = t1H / 2;
    spireGroup.add(t1Mesh);

    // Tier 2 Setback (H = 5.0)
    const t2H = 5.0;
    const t2W = t1W * 0.72;
    const t2Mesh = new THREE.Mesh(new THREE.BoxGeometry(t2W, t2H, t2W), bMeshMaterials);
    t2Mesh.position.y = t1H + (t2H / 2);
    spireGroup.add(t2Mesh);

    // Tier 3 Observation Crown (H = 2.4) - Radiant Cyan Crystal
    const t3H = 2.4;
    const crownMat = new THREE.MeshStandardMaterial({
      color: 0x00F5D4,
      emissive: new THREE.Color(0x00F5D4),
      emissiveIntensity: 0.8,
      roughness: 0.1,
      metalness: 0.85
    });
    const t3Mesh = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.6, t3H, 16), crownMat);
    t3Mesh.position.y = t1H + t2H + (t3H / 2);
    spireGroup.add(t3Mesh);

    // Tier 4 Pinnacle Needle Spire (H = 3.8)
    const needleH = 3.8;
    const needleMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.25, needleH, 8), new THREE.MeshStandardMaterial({ color: 0xFFFFFF, metalness: 0.95 }));
    needleMesh.position.y = t1H + t2H + t3H + (needleH / 2);
    spireGroup.add(needleMesh);

    // Quantum Summit Orb
    const orbMesh = new THREE.Mesh(new THREE.SphereGeometry(0.42, 16, 16), cyanNeonMat);
    orbMesh.position.y = t1H + t2H + t3H + needleH;
    spireGroup.add(orbMesh);

    // Orbiting Energy Halos
    const halo1 = new THREE.Mesh(new THREE.TorusGeometry(1.8, 0.04, 8, 48), cyanNeonMat);
    halo1.rotation.x = Math.PI / 3;
    halo1.position.y = t1H + t2H + t3H / 2;
    spireGroup.add(halo1);

    const halo2 = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.03, 8, 48), goldNeonMat);
    halo2.rotation.x = -Math.PI / 4;
    halo2.position.y = t1H + t2H + t3H / 2;
    spireGroup.add(halo2);

    // ═══════════════════════════════════════════════════════════════
    // 7. HIGH-SPEED STREET TRAFFIC
    // ═══════════════════════════════════════════════════════════════
    const carCount = 70;
    const carGeo = new THREE.BoxGeometry(0.18, 0.08, 0.9);
    const vehicles = [];

    for (let i = 0; i < carCount; i++) {
      const isCyan = Math.random() > 0.45;
      const cMesh = new THREE.Mesh(carGeo, isCyan ? cyanNeonMat : goldNeonMat);

      const lane = (Math.floor(Math.random() * numBlocks) * blockPitch) - (islandSize / 2) + (blockPitch / 2);
      const isVert = Math.random() > 0.5;
      const speed = (0.16 + Math.random() * 0.24) * (Math.random() > 0.5 ? 1 : -1);

      if (isVert) {
        cMesh.position.set(lane, 0.06, (Math.random() * islandSize) - (islandSize / 2));
        cMesh.rotation.y = 0;
      } else {
        cMesh.position.set((Math.random() * islandSize) - (islandSize / 2), 0.06, lane);
        cMesh.rotation.y = Math.PI / 2;
      }

      cityIsland.add(cMesh);
      vehicles.push({ mesh: cMesh, speed, isVert, bound: islandSize / 2 - 0.5 });
    }

    // ═══════════════════════════════════════════════════════════════
    // 8. AMBIENT CYBER PARTICLES
    // ═══════════════════════════════════════════════════════════════
    const pCount = 600;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(pCount * 3);
    const pColors = new Float32Array(pCount * 3);

    for (let i = 0; i < pCount * 3; i += 3) {
      pPos[i] = (Math.random() - 0.5) * 55;
      pPos[i + 1] = Math.random() * 35;
      pPos[i + 2] = (Math.random() - 0.5) * 55;

      if (Math.random() > 0.4) {
        pColors[i] = 0.0; pColors[i + 1] = 0.96; pColors[i + 2] = 0.83;
      } else {
        pColors[i] = 1.0; pColors[i + 1] = 0.82; pColors[i + 2] = 0.2;
      }
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

    const dustParticles = new THREE.Points(pGeo, new THREE.PointsMaterial({
      size: 0.13,
      vertexColors: true,
      transparent: true,
      opacity: 0.85
    }));
    scene.add(dustParticles);

    // ═══════════════════════════════════════════════════════════════
    // 9. BALANCED LIGHTING DESIGN
    // ═══════════════════════════════════════════════════════════════
    const ambientLight = new THREE.AmbientLight(0x0C1422, 1.2);
    scene.add(ambientLight);

    const dirMoon = new THREE.DirectionalLight(0xC7D2FE, 2.2);
    dirMoon.position.set(30, 45, 25);
    scene.add(dirMoon);

    const keyCyan = new THREE.PointLight(0x00F5D4, 4.0, 60);
    keyCyan.position.set(20, 22, 20);
    scene.add(keyCyan);

    const fillGold = new THREE.PointLight(0xFFB703, 3.2, 55);
    fillGold.position.set(-20, 16, -20);
    scene.add(fillGold);

    const spireGlow = new THREE.PointLight(0x00F5D4, 6.0, 25);
    spireGlow.position.set(0, t1H + t2H + t3H + needleH + 0.5, 0);
    scene.add(spireGlow);

    // ═══════════════════════════════════════════════════════════════
    // 10. INTERACTION & CAMERA CONTROLS
    // ═══════════════════════════════════════════════════════════════
    let isOrbiting = true;
    let isTurbo = false;
    let isWireframe = false;
    let isDragging = false;
    let prevMouse = { x: 0, y: 0 };
    let mouseX = 0, mouseY = 0;
    let targetX = 0, targetY = 0;

    window.addEventListener('mousedown', (e) => {
      if (e.target.closest('.bottom-dock') || e.target.closest('.hud-header')) return;
      isDragging = true;
      prevMouse = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.clientY / window.innerHeight) * 2 + 1;

      if (isDragging) {
        const dx = e.clientX - prevMouse.x;
        const dy = e.clientY - prevMouse.y;
        orbitAngle -= dx * 0.005;
        framing.height = Math.max(14, Math.min(55, framing.height + dy * 0.06));
        prevMouse = { x: e.clientX, y: e.clientY };
      }
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (isDragging && e.touches.length === 1) {
        const dx = e.touches[0].clientX - prevMouse.x;
        const dy = e.touches[0].clientY - prevMouse.y;
        orbitAngle -= dx * 0.006;
        framing.height = Math.max(14, Math.min(55, framing.height + dy * 0.06));
        prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
    }, { passive: true });

    window.addEventListener('touchend', () => { isDragging = false; });

    // Buttons
    const btnOrbit = document.getElementById('btn-orbit');
    btnOrbit.addEventListener('click', () => {
      isOrbiting = !isOrbiting;
      btnOrbit.classList.toggle('active', isOrbiting);
    });

    const btnTurbo = document.getElementById('btn-turbo');
    btnTurbo.addEventListener('click', () => {
      isTurbo = !isTurbo;
      btnTurbo.classList.toggle('active', isTurbo);
      btnTurbo.textContent = isTurbo ? '⚡ Turbo: ON' : '⚡ Turbo Speed';
    });

    const btnWireframe = document.getElementById('btn-wireframe');
    btnWireframe.addEventListener('click', () => {
      isWireframe = !isWireframe;
      buildingMat.wireframe = isWireframe;
      roofMat.wireframe = isWireframe;
      btnWireframe.classList.toggle('active', isWireframe);
    });

    const btnText = document.getElementById('btn-text');
    const editorialHud = document.getElementById('editorial-hud');
    let textVisible = true;
    btnText.addEventListener('click', () => {
      textVisible = !textVisible;
      editorialHud.style.opacity = textVisible ? '1' : '0';
      btnText.classList.toggle('active', textVisible);
    });

    window.addEventListener('resize', () => {
      framing = getFramingParams();
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ═══════════════════════════════════════════════════════════════
    // 11. 60 FPS RENDER LOOP
    // ═══════════════════════════════════════════════════════════════
    const clock = new THREE.Clock();
    let frameCount = 0;
    let lastTime = performance.now();
    const fpsBadge = document.getElementById('fps-badge');

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      // FPS Monitor
      frameCount++;
      const now = performance.now();
      if (now - lastTime >= 1000) {
        const fps = Math.round((frameCount * 1000) / (now - lastTime));
        fpsBadge.textContent = `${fps} FPS`;
        frameCount = 0;
        lastTime = now;
      }

      const speed = isTurbo ? 2.6 : 1.0;

      // Turntable Orbit
      if (isOrbiting && !isDragging) {
        orbitAngle += delta * 0.16 * speed;
      }

      // Parallax Mouse Easing
      targetX += (mouseX - targetX) * 0.04;
      targetY += (mouseY - targetY) * 0.04;

      const curX = Math.sin(orbitAngle) * framing.radius + (targetX * 2.5);
      const curZ = Math.cos(orbitAngle) * framing.radius + (targetY * 2.5);
      camera.position.set(curX, framing.height, curZ);
      camera.lookAt(0, framing.targetY, 0);

      // Rotate Spire Halos
      halo1.rotation.z = elapsed * 0.9 * speed;
      halo2.rotation.z = -elapsed * 0.7 * speed;

      // Pulse Summit Orb
      const pulse = 1.0 + Math.sin(elapsed * 4.5 * speed) * 0.16;
      orbMesh.scale.set(pulse, pulse, pulse);
      spireGlow.intensity = 5.5 + Math.sin(elapsed * 4.5) * 2.0;

      // Flashing Rooftop Beacon Lights
      const flash = Math.sin(elapsed * 6.5) > 0.2;
      beaconLights.forEach((b, idx) => {
        b.visible = ((idx % 2 === 0) ? flash : !flash);
      });

      // Street Traffic Movement
      vehicles.forEach(v => {
        if (v.isVert) {
          v.mesh.position.z += v.speed * speed;
          if (v.mesh.position.z > v.bound) v.mesh.position.z = -v.bound;
          if (v.mesh.position.z < -v.bound) v.mesh.position.z = v.bound;
        } else {
          v.mesh.position.x += v.speed * speed;
          if (v.mesh.position.x > v.bound) v.mesh.position.x = -v.bound;
          if (v.mesh.position.x < -v.bound) v.mesh.position.x = v.bound;
        }
      });

      // Ambient Dust Drift
      dustParticles.rotation.y = elapsed * 0.015 * speed;

      // Orbit Specular Key Lights
      keyCyan.position.x = Math.sin(elapsed * 0.5) * 28;
      keyCyan.position.z = Math.cos(elapsed * 0.5) * 28;

      fillGold.position.x = -Math.sin(elapsed * 0.4) * 26;
      fillGold.position.z = -Math.cos(elapsed * 0.4) * 26;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
