<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalyan's Lab · 3D WebGL Glass Card ($0 Workflow)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #0A0D14;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      color: #fff;
      height: 100%;
      width: 100%;
      position: relative;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .hud {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      text-align: center;
      pointer-events: none;
      width: 90%;
      max-width: 600px;
    }
    .hud-tag {
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #00F5D4;
      font-weight: 800;
      padding: 8px 18px;
      background: rgba(0, 245, 212, 0.12);
      border: 1px solid rgba(0, 245, 212, 0.4);
      border-radius: 999px;
      display: inline-block;
      margin-bottom: 8px;
      box-shadow: 0 4px 20px rgba(0, 245, 212, 0.2);
    }
    .hud-title {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .interaction-pill {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #00F5D4;
      background: rgba(10, 13, 20, 0.85);
      border: 1.5px solid rgba(0, 245, 212, 0.6);
      box-shadow: 0 8px 32px rgba(0, 245, 212, 0.35);
      padding: 14px 32px;
      border-radius: 999px;
      z-index: 20;
      pointer-events: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      backdrop-filter: blur(16px);
      white-space: nowrap;
    }
    @media (max-height: 700px) {
      .hud { top: 16px; }
      .hud-tag { font-size: 11px; padding: 6px 14px; }
      .hud-title { font-size: 15px; }
      .interaction-pill { bottom: 20px; font-size: 13px; padding: 10px 22px; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div class="hud">
    <div class="hud-tag">⚡ Kalyan's Lab · $0 Motion Graphics</div>
    <div class="hud-title">Interactive 3D WebGL Glass Card</div>
  </div>

  <div id="canvas-container"></div>
  <div class="interaction-pill">👆 Move mouse or drag screen to tilt card</div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0A0D14, 0.05);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 7;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);

    const cyanLight = new THREE.PointLight(0x00F5D4, 3.5, 20);
    cyanLight.position.set(-3, 2, 3);
    scene.add(cyanLight);

    const redLight = new THREE.PointLight(0xFF453A, 2.8, 20);
    redLight.position.set(3, -2, 2);
    scene.add(redLight);

    const topRimLight = new THREE.DirectionalLight(0xffffff, 1.8);
    topRimLight.position.set(0, 5, 2);
    scene.add(topRimLight);

    function createCardTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 640;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 1024, 640);
      grad.addColorStop(0, 'rgba(25, 30, 48, 0.92)');
      grad.addColorStop(1, 'rgba(10, 14, 22, 0.98)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 640);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.lineWidth = 4;
      ctx.strokeRect(8, 8, 1008, 624);

      ctx.fillStyle = '#00F5D4';
      ctx.font = 'bold 30px -apple-system, sans-serif';
      ctx.fillText("KALYAN'S LAB · THREE.JS", 50, 80);

      ctx.strokeStyle = '#00F5D4';
      ctx.lineWidth = 3;
      ctx.strokeRect(50, 135, 80, 60);
      ctx.fillStyle = 'rgba(0, 245, 212, 0.25)';
      ctx.fillRect(50, 135, 80, 60);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 62px -apple-system, sans-serif';
      ctx.fillText("$0 MOTION GRAPHICS", 50, 310);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
      ctx.font = '32px -apple-system, sans-serif';
      ctx.fillText("Real-time WebGL · 60 FPS", 50, 365);

      ctx.fillStyle = 'rgba(0, 245, 212, 0.15)';
      ctx.strokeStyle = 'rgba(0, 245, 212, 0.6)';
      ctx.lineWidth = 2;
      ctx.fillRect(50, 450, 440, 110);
      ctx.strokeRect(50, 450, 440, 110);

      ctx.fillStyle = '#00F5D4';
      ctx.font = 'bold 48px -apple-system, sans-serif';
      ctx.fillText("+1,203 VIEWS 🚀", 70, 520);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.font = 'bold 24px -apple-system, monospace';
      ctx.fillText("CLAUDE + THREE.JS", 680, 520);

      const texture = new THREE.CanvasTexture(canvas);
      texture.anisotropy = 8;
      return texture;
    }

    const cardGeometry = new THREE.BoxGeometry(4.2, 2.6, 0.12);
    const cardTexture = createCardTexture();

    const materials = [
      new THREE.MeshStandardMaterial({ color: 0x111622, roughness: 0.3, metalness: 0.8 }),
      new THREE.MeshStandardMaterial({ color: 0x111622, roughness: 0.3, metalness: 0.8 }),
      new THREE.MeshStandardMaterial({ color: 0x00F5D4, roughness: 0.2, metalness: 0.5 }),
      new THREE.MeshStandardMaterial({ color: 0x111622, roughness: 0.3, metalness: 0.8 }),
      new THREE.MeshStandardMaterial({ map: cardTexture, roughness: 0.22, metalness: 0.4 }),
      new THREE.MeshStandardMaterial({ color: 0x0A0D14, roughness: 0.4, metalness: 0.8 })
    ];

    const card = new THREE.Mesh(cardGeometry, materials);
    scene.add(card);

    const particleCount = 400;
    const particleGeometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 15;
      positions[i + 1] = (Math.random() - 0.5) * 15;
      positions[i + 2] = (Math.random() - 0.5) * 10;
    }
    particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const particleMaterial = new THREE.PointsMaterial({
      color: 0x00F5D4,
      size: 0.04,
      transparent: true,
      opacity: 0.7
    });

    const particles = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(particles);

    let mouseX = 0;
    let mouseY = 0;
    let targetX = 0;
    let targetY = 0;

    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouseX = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      targetX += (mouseX - targetX) * 0.05;
      targetY += (mouseY - targetY) * 0.05;

      card.position.y = Math.sin(elapsedTime * 1.5) * 0.15;
      card.rotation.x = -targetY * 0.45 + Math.sin(elapsedTime * 0.8) * 0.08;
      card.rotation.y = targetX * 0.65 + Math.cos(elapsedTime * 1.0) * 0.12;

      particles.rotation.y = elapsedTime * 0.02;

      cyanLight.position.x = Math.sin(elapsedTime) * 4;
      cyanLight.position.y = Math.cos(elapsedTime * 0.8) * 3;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
