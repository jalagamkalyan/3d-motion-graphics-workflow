<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalyan's Lab · 3D WebGL Glass Card ($0 Workflow)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #0A0D14;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      color: #fff;
      height: 100%;
      width: 100%;
      position: relative;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Ambient Background Vignette & Glows */
    .bg-glow-cyan {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 245, 212, 0.18) 0%, rgba(10, 13, 20, 0) 70%);
      top: 20%;
      left: 15%;
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
    }
    .bg-glow-red {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 69, 58, 0.15) 0%, rgba(10, 13, 20, 0) 70%);
      bottom: 20%;
      right: 15%;
      filter: blur(90px);
      z-index: 0;
      pointer-events: none;
    }

    /* Top HUD Navigation Bar */
    .top-nav {
      position: absolute;
      top: 24px;
      left: 0;
      width: 100%;
      padding: 0 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      pointer-events: auto;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-logo {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      width: 32px;
      height: 28px;
      padding: 4px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
    }
    .bar { border-radius: 2px; }
    .bar-1 { width: 6px; height: 12px; background: #FF453A; }
    .bar-2 { width: 6px; height: 18px; background: #E5E5EA; }
    .bar-3 { width: 6px; height: 24px; background: #FFD60A; }

    .brand-text-wrap {
      display: flex;
      flex-direction: column;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #FFFFFF;
    }
    .brand-sub {
      font-size: 12px;
      color: #00F5D4;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Subscribe Button - Directly Points to Kalyan's Lab */
    .btn-subscribe {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      background: #FF0000;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.04em;
      border-radius: 999px;
      box-shadow: 0 4px 20px rgba(255, 0, 0, 0.45);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-subscribe:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 30px rgba(255, 0, 0, 0.65);
      background: #FF1A1A;
    }
    .btn-subscribe svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Bottom Control Dock */
    .bottom-dock {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 30;
      pointer-events: auto;
      max-width: 95vw;
      flex-wrap: wrap;
      justify-content: center;
    }
    .dock-pill {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #00F5D4;
      background: rgba(16, 21, 32, 0.85);
      border: 1px solid rgba(0, 245, 212, 0.45);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      padding: 10px 20px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      backdrop-filter: blur(16px);
      user-select: none;
    }
    .dock-btn {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .dock-btn:hover {
      background: rgba(0, 245, 212, 0.2);
      border-color: #00F5D4;
      color: #00F5D4;
      transform: translateY(-2px);
    }

    @media (max-width: 650px) {
      .top-nav { padding: 0 16px; top: 16px; }
      .brand-title { font-size: 14px; }
      .btn-subscribe { padding: 8px 16px; font-size: 12px; }
      .bottom-dock { bottom: 16px; gap: 8px; }
      .dock-pill { font-size: 11px; padding: 8px 14px; }
      .dock-btn { font-size: 11px; padding: 8px 12px; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div class="bg-glow-cyan"></div>
  <div class="bg-glow-red"></div>

  <!-- Top Navigation with Official Brand & YouTube Subscribe Button -->
  <header class="top-nav">
    <div class="brand-wrap">
      <div class="brand-logo" title="Kalyan's Lab">
        <div class="bar bar-1"></div>
        <div class="bar bar-2"></div>
        <div class="bar bar-3"></div>
      </div>
      <div class="brand-text-wrap">
        <span class="brand-title">Kalyan's Lab</span>
        <span class="brand-sub">Three.js $0 Motion Graphics</span>
      </div>
    </div>

    <!-- Official Channel Subscription Link with Confirmation Prompt -->
    <a href="https://www.youtube.com/@KalyansLab?sub_confirmation=1" target="_blank" rel="noopener noreferrer" class="btn-subscribe" id="ytSubscribeBtn">
      <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
      <span>Subscribe to Kalyan's Lab</span>
    </a>
  </header>

  <!-- Canvas Container for 3D Scene -->
  <div id="canvas-container"></div>

  <!-- Interactive Controls Dock -->
  <footer class="bottom-dock">
    <div class="dock-pill">👆 Move mouse / drag to tilt card</div>
    <button class="dock-btn" id="btnSpin">🔄 360° Spin</button>
    <button class="dock-btn" id="btnWireframe">🌐 Wireframe</button>
    <a href="https://github.com/jalagamkalyan/3d-motion-graphics-workflow" target="_blank" class="dock-btn" style="text-decoration: none;">💻 GitHub Code</a>
  </footer>

  <script>
    // --- 1. Scene & Camera Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0A0D14, 0.04);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 7.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    container.appendChild(renderer.domElement);

    // --- 2. Advanced Multi-Point Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
    scene.add(ambientLight);

    const cyanLight = new THREE.PointLight(0x00F5D4, 3.8, 25);
    cyanLight.position.set(-3.5, 2.5, 3.5);
    scene.add(cyanLight);

    const redLight = new THREE.PointLight(0xFF453A, 3.0, 22);
    redLight.position.set(3.5, -2.5, 2.8);
    scene.add(redLight);

    const goldLight = new THREE.PointLight(0xFFD60A, 2.2, 18);
    goldLight.position.set(0, 3.8, 1.5);
    scene.add(goldLight);

    const topRimLight = new THREE.DirectionalLight(0xffffff, 1.6);
    topRimLight.position.set(0, 6, 2);
    scene.add(topRimLight);

    // Front Face Texture: Clean, High-End Procedural 3D Visual
    function createCardFrontTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1600;
      canvas.height = 1000;
      const ctx = canvas.getContext('2d');

      // 1. Deep Obsidian Carbon Glass Base
      const grad = ctx.createLinearGradient(0, 0, 1600, 1000);
      grad.addColorStop(0, '#0E121B');
      grad.addColorStop(0.5, '#080A10');
      grad.addColorStop(1, '#05060A');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1600, 1000);

      // Subtle Precision Micro-Dot Matrix & Crosshairs
      ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
      for (let x = 80; x < 1560; x += 80) {
        for (let y = 80; y < 960; y += 80) {
          ctx.beginPath();
          ctx.arc(x, y, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Outer Chamfered Glass Border
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
      ctx.lineWidth = 4;
      ctx.strokeRect(20, 20, 1560, 960);

      // Inner Neon Accent Rim
      ctx.strokeStyle = 'rgba(0, 245, 212, 0.35)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(32, 32, 1536, 936);

      // --- 2. Top Header: Brand Emblem & Minimalist Spec ---
      ctx.fillStyle = 'rgba(255, 255, 255, 0.07)';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(80, 80, 80, 72, 16);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#FF453A'; ctx.fillRect(94, 114, 12, 26);
      ctx.fillStyle = '#E5E5EA'; ctx.fillRect(114, 102, 12, 38);
      ctx.fillStyle = '#FFD60A'; ctx.fillRect(134, 90, 12, 50);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 46px -apple-system, sans-serif';
      ctx.fillText("KALYAN'S LAB", 185, 128);

      // Status Pill: Realtime 60 FPS WebGL
      ctx.fillStyle = 'rgba(0, 245, 212, 0.12)';
      ctx.strokeStyle = '#00F5D4';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(1230, 88, 290, 56, 999);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#30D158';
      ctx.beginPath();
      ctx.arc(1265, 116, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#00F5D4';
      ctx.font = '800 22px monospace';
      ctx.fillText("THREE.JS · 60 FPS", 1285, 124);

      // --- 3. Hero Visual Centerpiece: Dynamic Multi-Channel Spectrum Visualizer ---
      // Equalizer Spectrum Columns (Volumetric Bars)
      const barCount = 28;
      const barWidth = 36;
      const barGap = 16;
      const startX = (1600 - (barCount * (barWidth + barGap) - barGap)) / 2;
      const baseY = 540;

      for (let i = 0; i < barCount; i++) {
        const norm = i / (barCount - 1);
        const height = 40 + Math.sin(norm * Math.PI) * 160 + Math.cos(norm * 6.0) * 35;
        const x = startX + i * (barWidth + barGap);
        const y = baseY - height / 2;

        const colGrad = ctx.createLinearGradient(x, y + height, x, y);
        colGrad.addColorStop(0, 'rgba(0, 245, 212, 0.15)');
        colGrad.addColorStop(0.6, 'rgba(0, 245, 212, 0.85)');
        colGrad.addColorStop(1, '#FFD60A');

        ctx.fillStyle = colGrad;
        ctx.beginPath();
        ctx.roundRect(x, y, barWidth, height, 8);
        ctx.fill();

        // Bar Cap Glow
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(x + 4, y, barWidth - 8, 4);
      }

      // High-Frequency Laser Oscilloscope Line (Glowing Sine Wave)
      ctx.strokeStyle = '#00F5D4';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#00F5D4';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.moveTo(80, baseY);
      for (let x = 80; x <= 1520; x += 15) {
        const norm = (x - 80) / 1440;
        const wave = Math.sin(norm * 14.0) * 45 * Math.sin(norm * Math.PI) + Math.cos(norm * 24.0) * 18;
        ctx.lineTo(x, baseY + wave);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Telemetry Data Points
      ctx.fillStyle = 'rgba(0, 245, 212, 0.7)';
      ctx.font = '700 20px monospace';
      ctx.fillText("[ FREQ: 48.0 kHz ]", 80, 420);
      ctx.textAlign = 'right';
      ctx.fillText("[ BUFFER: 60 FPS ]", 1520, 420);
      ctx.textAlign = 'left';

      // --- 4. Clean Minimalist Display Title (Below Visualizer) ---
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 84px -apple-system, sans-serif';
      ctx.letterSpacing = '-0.02em';
      ctx.fillText("3D MOTION COMPONENT", 80, 750);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
      ctx.font = '600 32px -apple-system, sans-serif';
      ctx.fillText("Real-Time Procedural WebGL · Zero External Video Plugins", 80, 810);

      // --- 5. Clean Minimalist Footer ---
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(80, 870);
      ctx.lineTo(1520, 870);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
      ctx.font = '700 22px monospace';
      ctx.fillText("$0 WORKFLOW · THREE.JS PROCEDURAL GRAPHICS", 80, 925);

      ctx.fillStyle = '#00F5D4';
      ctx.font = '700 22px monospace';
      ctx.textAlign = 'right';
      ctx.fillText("KALYAN'S LAB · GITHUB: JALAGAMKALYAN", 1520, 925);
      ctx.textAlign = 'left';

      const texture = new THREE.CanvasTexture(canvas);
      texture.anisotropy = 16;
      return texture;
    }

    // Back Face Texture: Cybernetic Silicon Chip & GPU Micro-Architecture
    function createCardBackTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1600;
      canvas.height = 1000;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#080A10';
      ctx.fillRect(0, 0, 1600, 1000);

      // Micro-Grid Matrix
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let x = 40; x < 1600; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1000); ctx.stroke();
      }
      for (let y = 40; y < 1000; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1600, y); ctx.stroke();
      }

      // Cyber Circuit Bus Traces (Gold & Cyan)
      ctx.strokeStyle = 'rgba(0, 245, 212, 0.28)';
      ctx.lineWidth = 3;
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.moveTo(100 + i * 260, 0);
        ctx.lineTo(180 + i * 260, 320);
        ctx.lineTo(140 + i * 260, 680);
        ctx.lineTo(260 + i * 260, 1000);
        ctx.stroke();
      }

      ctx.strokeStyle = 'rgba(255, 214, 10, 0.25)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(0, 150 + i * 160);
        ctx.lineTo(400, 200 + i * 160);
        ctx.lineTo(1200, 200 + i * 160);
        ctx.lineTo(1600, 250 + i * 160);
        ctx.stroke();
      }

      // Outer Border
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
      ctx.lineWidth = 4;
      ctx.strokeRect(20, 20, 1560, 960);

      // Central Cybernetic Silicon Die (The Microprocessor Core)
      const chipX = 460, chipY = 250, chipW = 680, chipH = 500;
      ctx.fillStyle = '#0E131E';
      ctx.strokeStyle = '#00F5D4';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#00F5D4';
      ctx.shadowBlur = 24;
      ctx.beginPath();
      ctx.roundRect(chipX, chipY, chipW, chipH, 24);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Chip Pin Connectors
      ctx.fillStyle = '#FFD60A';
      for (let p = chipX + 40; p < chipX + chipW - 20; p += 32) {
        ctx.fillRect(p, chipY - 14, 16, 14);
        ctx.fillRect(p, chipY + chipH, 16, 14);
      }
      for (let p = chipY + 40; p < chipY + chipH - 20; p += 32) {
        ctx.fillRect(chipX - 14, p, 14, 16);
        ctx.fillRect(chipX + chipW, p, 14, 16);
      }

      // Chip Emblem & Text
      ctx.fillStyle = '#00F5D4';
      ctx.font = '800 24px monospace';
      ctx.textAlign = 'center';
      ctx.fillText("< THREE.JS r128 ENGINE />", 800, chipY + 90);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 64px -apple-system, sans-serif';
      ctx.fillText("PROCEDURAL CAD", 800, chipY + 180);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.font = '600 26px -apple-system, sans-serif';
      ctx.fillText("GPU-Accelerated 3D Mesh Component", 800, chipY + 230);

      // Pinned GitHub Badge inside chip
      ctx.fillStyle = 'rgba(0, 245, 212, 0.14)';
      ctx.strokeStyle = '#00F5D4';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(520, chipY + 290, 560, 60, 999);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#00F5D4';
      ctx.font = '800 24px monospace';
      ctx.fillText("GITHUB.COM / JALAGAMKALYAN", 800, chipY + 328);

      ctx.fillStyle = '#FFD60A';
      ctx.font = '700 22px monospace';
      ctx.fillText("FREE OPEN SOURCE WORKFLOW", 800, chipY + 410);

      ctx.textAlign = 'left';

      const texture = new THREE.CanvasTexture(canvas);
      texture.anisotropy = 16;
      return texture;
    }

    // --- 4. 3D Objects & Materials ---
    const frontTex = createCardFrontTexture();
    const backTex = createCardBackTexture();

    const cardGeo = new THREE.BoxGeometry(4.6, 2.85, 0.14);

    // Ultra-Glossy Chamfered Glass Materials
    const glassMatFront = new THREE.MeshPhysicalMaterial({
      map: frontTex,
      roughness: 0.12,
      metalness: 0.2,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06,
      reflectivity: 0.95
    });

    const glassMatBack = new THREE.MeshPhysicalMaterial({
      map: backTex,
      roughness: 0.15,
      metalness: 0.2,
      clearcoat: 1.0,
      clearcoatRoughness: 0.08
    });

    const glassMatEdge = new THREE.MeshStandardMaterial({
      color: 0x00F5D4,
      emissive: 0x004438,
      roughness: 0.15,
      metalness: 0.8
    });

    const materials = [
      glassMatEdge,
      glassMatEdge,
      glassMatEdge,
      glassMatEdge,
      glassMatFront,
      glassMatBack
    ];

    const cardGroup = new THREE.Group();
    const cardMesh = new THREE.Mesh(cardGeo, materials);
    cardGroup.add(cardMesh);

    // Glowing Neon Hologram Outer Trim
    const trimGeo = new THREE.BoxGeometry(4.64, 2.89, 0.142);
    const trimMat = new THREE.MeshBasicMaterial({
      color: 0x00F5D4,
      wireframe: true,
      transparent: true,
      opacity: 0.35
    });
    const trimMesh = new THREE.Mesh(trimGeo, trimMat);
    cardGroup.add(trimMesh);

    scene.add(cardGroup);

    // --- 5. Futuristic Cinematic Ambient Rings ---
    const ring1Geo = new THREE.TorusGeometry(3.6, 0.018, 16, 120);
    const ring1Mat = new THREE.MeshBasicMaterial({ color: 0x00F5D4, transparent: true, opacity: 0.35 });
    const ring1 = new THREE.Mesh(ring1Geo, ring1Mat);
    ring1.rotation.x = Math.PI / 3.2;
    ring1.rotation.y = Math.PI / 6;
    scene.add(ring1);

    const ring2Geo = new THREE.TorusGeometry(4.2, 0.014, 16, 120);
    const ring2Mat = new THREE.MeshBasicMaterial({ color: 0xFF453A, transparent: true, opacity: 0.25 });
    const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
    ring2.rotation.x = -Math.PI / 4;
    ring2.rotation.z = Math.PI / 5;
    scene.add(ring2);

    // --- 6. Multi-Layer Particle Universe ---
    const pCount = 550;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(pCount * 3);
    const pColors = new Float32Array(pCount * 3);

    for (let i = 0; i < pCount * 3; i += 3) {
      pPos[i] = (Math.random() - 0.5) * 18;
      pPos[i + 1] = (Math.random() - 0.5) * 18;
      pPos[i + 2] = (Math.random() - 0.5) * 12;

      // Dual particle colors: Cyan & Pale Gold
      if (Math.random() > 0.35) {
        pColors[i] = 0.0; pColors[i + 1] = 0.96; pColors[i + 2] = 0.83;
      } else {
        pColors[i] = 1.0; pColors[i + 1] = 0.84; pColors[i + 2] = 0.2;
      }
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

    const pMat = new THREE.PointsMaterial({
      size: 0.045,
      vertexColors: true,
      transparent: true,
      opacity: 0.75
    });
    const particles = new THREE.Points(pGeo, pMat);
    scene.add(particles);

    // --- 7. Mouse / Touch Interactive Physics ---
    let mouseX = 0, mouseY = 0;
    let targetX = 0, targetY = 0;
    let isSpinning = false;
    let spinVelocity = 0;
    let isWireframe = false;

    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouseX = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
      }
    }, { passive: true });

    // 360 Spin Trigger
    const btnSpin = document.getElementById('btnSpin');
    function triggerSpin() {
      if (!isSpinning) {
        isSpinning = true;
        spinVelocity = 14.0;
      }
    }
    btnSpin.addEventListener('click', triggerSpin);
    container.addEventListener('click', triggerSpin);

    // Wireframe Toggle
    const btnWireframe = document.getElementById('btnWireframe');
    btnWireframe.addEventListener('click', () => {
      isWireframe = !isWireframe;
      materials.forEach(m => m.wireframe = isWireframe);
      btnWireframe.textContent = isWireframe ? '✨ Glass Mode' : '🌐 Wireframe';
    });

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 8. Render Loop ---
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      // Smooth Inertia Easing
      targetX += (mouseX - targetX) * 0.055;
      targetY += (mouseY - targetY) * 0.055;

      // Handle 360 Spin Physics
      if (isSpinning) {
        cardGroup.rotation.y += spinVelocity * 0.02;
        spinVelocity *= 0.94;
        if (Math.abs(spinVelocity) < 0.05) {
          isSpinning = false;
          spinVelocity = 0;
        }
      } else {
        // Natural Floating Oscillation + Parallax Tilt
        cardGroup.rotation.x = -targetY * 0.48 + Math.sin(elapsedTime * 0.8) * 0.06;
        cardGroup.rotation.y = targetX * 0.68 + Math.cos(elapsedTime * 0.9) * 0.08;
      }

      cardGroup.position.y = Math.sin(elapsedTime * 1.4) * 0.12;

      // Rotate Ambient Rings & Particles
      ring1.rotation.z = elapsedTime * 0.12;
      ring2.rotation.z = -elapsedTime * 0.08;
      particles.rotation.y = elapsedTime * 0.015;

      // Orbiting Specular Caustics
      cyanLight.position.x = Math.sin(elapsedTime * 0.9) * 4.2 + targetX * 1.5;
      cyanLight.position.y = Math.cos(elapsedTime * 0.7) * 3.2 + targetY * 1.5;

      redLight.position.x = -Math.sin(elapsedTime * 0.8) * 4.0;
      redLight.position.y = -Math.cos(elapsedTime * 0.6) * 3.0;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
