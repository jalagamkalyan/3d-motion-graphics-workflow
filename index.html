<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalyan's Lab · 3D WebGL Glass Card ($0 Workflow)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0D14;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .hud {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }
    .hud-tag {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #00F5D4;
      font-weight: 700;
      padding: 6px 14px;
      background: rgba(0, 245, 212, 0.08);
      border: 1px solid rgba(0, 245, 212, 0.3);
      border-radius: 999px;
      display: inline-block;
      margin-bottom: 8px;
    }
    .hud-title {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 500;
    }
    .footer-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
      z-index: 10;
      pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div class="hud">
    <div class="hud-tag">Kalyan's Lab · $0 Motion Graphics</div>
    <div class="hud-title">Interactive 3D WebGL Glass Card</div>
  </div>

  <div id="canvas-container"></div>
  <div class="footer-hint">Move mouse or touch screen to rotate card</div>

  <script>
    // --- 1. Scene, Camera, Renderer ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0A0D14, 0.05);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 7;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // --- 2. Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const cyanLight = new THREE.PointLight(0x00F5D4, 3, 20);
    cyanLight.position.set(-3, 2, 3);
    scene.add(cyanLight);

    const redLight = new THREE.PointLight(0xFF453A, 2.5, 20);
    redLight.position.set(3, -2, 2);
    scene.add(redLight);

    const topRimLight = new THREE.DirectionalLight(0xffffff, 1.5);
    topRimLight.position.set(0, 5, 2);
    scene.add(topRimLight);

    // --- 3. Dynamic Card Texture ---
    function createCardTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 640;
      const ctx = canvas.getContext('2d');

      // Glass gradient background
      const grad = ctx.createLinearGradient(0, 0, 1024, 640);
      grad.addColorStop(0, 'rgba(25, 30, 45, 0.85)');
      grad.addColorStop(1, 'rgba(10, 14, 22, 0.95)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 640);

      // Hairline border
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.lineWidth = 4;
      ctx.strokeRect(8, 8, 1008, 624);

      // Top brand tag
      ctx.fillStyle = '#00F5D4';
      ctx.font = 'bold 28px -apple-system, sans-serif';
      ctx.fillText("KALYAN'S LAB · THREE.JS", 50, 80);

      // Chip icon
      ctx.strokeStyle = '#00F5D4';
      ctx.lineWidth = 3;
      ctx.strokeRect(50, 140, 80, 60);
      ctx.fillStyle = 'rgba(0, 245, 212, 0.2)';
      ctx.fillRect(50, 140, 80, 60);

      // Big Title
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 58px -apple-system, sans-serif';
      ctx.fillText("$0 MOTION GRAPHICS", 50, 310);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.font = '32px -apple-system, sans-serif';
      ctx.fillText("Real-time WebGL · 60 FPS", 50, 365);

      // Metric Badge Box
      ctx.fillStyle = 'rgba(0, 245, 212, 0.12)';
      ctx.strokeStyle = 'rgba(0, 245, 212, 0.5)';
      ctx.lineWidth = 2;
      ctx.fillRect(50, 460, 420, 100);
      ctx.strokeRect(50, 460, 420, 100);

      ctx.fillStyle = '#00F5D4';
      ctx.font = 'bold 44px -apple-system, sans-serif';
      ctx.fillText("+1,203 VIEWS 🚀", 70, 525);

      // Right bottom watermark
      ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.font = 'bold 24px -apple-system, monospace';
      ctx.fillText("CLAUDE + THREE.JS", 700, 525);

      const texture = new THREE.CanvasTexture(canvas);
      texture.anisotropy = 8;
      return texture;
    }

    // --- 4. 3D Card Mesh ---
    const cardGeometry = new THREE.BoxGeometry(4.2, 2.6, 0.1);
    const cardTexture = createCardTexture();

    const materials = [
      new THREE.MeshStandardMaterial({ color: 0x111622, roughness: 0.3, metalness: 0.8 }), // right
      new THREE.MeshStandardMaterial({ color: 0x111622, roughness: 0.3, metalness: 0.8 }), // left
      new THREE.MeshStandardMaterial({ color: 0x00F5D4, roughness: 0.2, metalness: 0.5 }), // top rim glow
      new THREE.MeshStandardMaterial({ color: 0x111622, roughness: 0.3, metalness: 0.8 }), // bottom
      new THREE.MeshStandardMaterial({ map: cardTexture, roughness: 0.25, metalness: 0.4 }), // front
      new THREE.MeshStandardMaterial({ color: 0x0A0D14, roughness: 0.4, metalness: 0.8 })  // back
    ];

    const card = new THREE.Mesh(cardGeometry, materials);
    scene.add(card);

    // --- 5. Floating Dust Particles ---
    const particleCount = 400;
    const particleGeometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 15;
      positions[i + 1] = (Math.random() - 0.5) * 15;
      positions[i + 2] = (Math.random() - 0.5) * 10;
    }
    particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const particleMaterial = new THREE.PointsMaterial({
      color: 0x00F5D4,
      size: 0.035,
      transparent: true,
      opacity: 0.6
    });

    const particles = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(particles);

    // --- 6. Mouse / Touch Tilt Interaction ---
    let mouseX = 0;
    let mouseY = 0;
    let targetX = 0;
    let targetY = 0;

    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouseX = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 7. Animation Loop ---
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      // Smooth mouse easing
      targetX += (mouseX - targetX) * 0.05;
      targetY += (mouseY - targetY) * 0.05;

      // Card idle float + mouse tilt
      card.position.y = Math.sin(elapsedTime * 1.5) * 0.15;
      card.rotation.x = -targetY * 0.4 + Math.sin(elapsedTime * 0.8) * 0.08;
      card.rotation.y = targetX * 0.6 + Math.cos(elapsedTime * 1.0) * 0.12;

      // Subtle particle drift
      particles.rotation.y = elapsedTime * 0.02;

      // Light oscillation
      cyanLight.position.x = Math.sin(elapsedTime) * 4;
      cyanLight.position.y = Math.cos(elapsedTime * 0.8) * 3;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
